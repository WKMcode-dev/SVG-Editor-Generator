name: Publish TypeScript migration 1.8.0
on:
  push:
    branches: [main]
    paths:
      - .migration/source-1.8.0.patch.gz.b64
      - .github/workflows/migrate-1.8.0.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-typescript-1.8.0
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed migration
        shell: pwsh
        run: |
          $packed = [Convert]::FromBase64String((Get-Content .migration/source-1.8.0.patch.gz.b64 -Raw))
          $stream = [IO.MemoryStream]::new($packed)
          $gzip = [IO.Compression.GZipStream]::new($stream, [IO.Compression.CompressionMode]::Decompress)
          $patchPath = Join-Path $env:RUNNER_TEMP 'svg-migration.patch'
          $output = [IO.File]::Create($patchPath)
          $gzip.CopyTo($output)
          $output.Dispose()
          $gzip.Dispose()
          if ((Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLower() -ne 'cec23106379051e07827e8903fc47b62ea549b4624157809c26b1325c94192f4') { throw 'Migration checksum mismatch' }
          git config core.autocrlf false
          git apply --index --binary $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Migration patch failed' }
          git rm -r --ignore-unmatch -- app.js build-editor.cjs desktop.cjs editor-repair.js editor-workbench.js geometry.js index.html style.css tests/desktop.cjs vendor
          if ($LASTEXITCODE -ne 0) { throw 'Legacy source cleanup failed' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Normalize formatter config
        run: npx prettier --write .prettierrc.json
      - run: npm run format:check
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:web
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run dist
      - run: npm run test:windows
      - name: Publish validated source and version tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch -- .migration/source-1.8.0.patch.gz.b64
          git add .prettierrc.json src-tauri/Cargo.lock
          git commit -m 'Release 1.8.0: TypeScript architecture, Tauri and tested web editor'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source publication failed' }
          git tag v1.8.0
          git push origin v1.8.0
          if ($LASTEXITCODE -ne 0) { throw 'Tag publication failed' }
      - name: Package downloads
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath SVG-Editor-Generator-web.zip
          git archive --format=zip --output=SVG-Editor-Generator-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SVG-Editor-Generator-1.8.0-Windows
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SVG-Editor-Generator-*.zip
            test-results/native-startup.png
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName })
          $assets += @('SVG-Editor-Generator-web.zip', 'SVG-Editor-Generator-source.zip')
          gh release create v1.8.0 @assets --title 'SVG Editor Generator 1.8.0' --notes-file RELEASE-NOTES.md --verify-tag
