name: Tauri Windows
on:
  workflow_dispatch:
  push:
    branches: [main, feat/tauri-rust]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:web
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run dist
      - name: Enable WebView2 test connection on the Windows runner
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name '*' -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null
      - run: npm run test:windows
      - name: Remove WebView2 test policy
        if: always()
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          Remove-ItemProperty -Path $key -Name '*' -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: SVG-Editor-Generator-Tauri-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/svg-editor-generator.exe
