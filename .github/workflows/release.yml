name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (leave empty for artifacts only)
        required: false
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm run build:web
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run dist
      - name: Enable WebView2 test connection on the Windows runner
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name '*' -Value '--remote-debugging-port=9222' -PropertyType String -Force | Out-Null
      - run: npm run test:windows
      - name: Remove WebView2 test policy
        if: always()
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          Remove-ItemProperty -Path $key -Name '*' -ErrorAction SilentlyContinue
      - name: Package web and source
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath SVG-Editor-Generator-web.zip
          git archive --format=zip --output=SVG-Editor-Generator-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SVG-Editor-Generator-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SVG-Editor-Generator-*.zip
      - name: Publish release only after successful build
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName })
          $assets += @('SVG-Editor-Generator-web.zip', 'SVG-Editor-Generator-source.zip')
          gh release create $env:RELEASE_TAG @assets --title "SVG Editor Generator $env:RELEASE_TAG" --notes-file RELEASE-NOTES.md --verify-tag
