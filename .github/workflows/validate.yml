name: Validate TypeScript and web
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SVG-Editor-UI-Previews
          path: |
            tests/mobile-tools-*.png
            tests/editor-tools-*.png
          if-no-files-found: ignore
