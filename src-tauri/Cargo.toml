[package]
name = "svg-editor-generator"
version = "1.8.0"
description = "Editor visual de SVG"
authors = ["WKMcode-dev"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
